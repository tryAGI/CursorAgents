  /v1/environments/{id}/secrets/{name}:
    parameters:
      - name: id
        in: path
        required: true
        description: "Environment ID."
        schema:
          type: string
          format: uuid
          example: '8f14e45f-ceea-4e6b-9c3a-1d2e3f4a5b6c'
      - name: name
        in: path
        required: true
        description: "Secret name, such as `NPM_TOKEN`."
        schema:
          type: string
          example: 'NPM_TOKEN'
    put:
      summary: Set an environment secret
      description: |
        Create an environment secret, rotate its value, or change its type or repositories. With `?id=`, the request changes that version. Without `?id=`, a name with no version gets one (`201`), a name with one version has it changed in place (`200`), and a name with several versions returns `409 secret_name_ambiguous`. A `PUT` never adds a second version to a name that has one, and an omitted `type` or `repos` keeps the current one. Build Secrets can't be set or changed through the API yet. See https://cursor.com/docs/cloud-agent/api/endpoints#set-an-environment-secret.
      operationId: setEnvironmentSecret
      parameters:
        - name: id
          in: query
          required: false
          description: "The `id` of the version to change."
          schema:
            type: string
            example: 'secv_3qKx9mT2bV7nR1cW5yZ8aQ'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretRequest'
      responses:
        '200':
          description: "The version was changed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '201':
          description: "The version was created. `id` and `createdAt` are left out when the new version isn't readable yet."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Plan or role not allowed, the environments API isn't enabled for your account (`feature_unavailable`), a `grok_` API key (`key_not_supported`), or a team that lets only admins change secrets (`team_admin_required`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "The environment doesn't exist or your API key can't change its secrets, including an environment outside its repository limit (`environment_not_found`), or `?id=` isn't a version of this name here (`secret_not_found`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: "The name has several versions and no `?id=` (`secret_name_ambiguous`, with `versions`), differs from an existing name only in case (`secret_name_conflict`), overlaps another version's repositories (`secret_scope_conflict`), the environment has 1,000 secrets (`secret_limit_reached`), or another request changed the secret at the same moment (`secret_changed`)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SecretNameAmbiguousError'
                  - $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete an environment secret
      description: |
        Delete one version of an environment secret. This action is irreversible. With `?id=`, the request deletes that version. Without `?id=`, a name with one version has it deleted, a name with no version returns `404 secret_not_found`, and a name with several versions returns `409 secret_name_ambiguous` and deletes nothing. `{name}` must match a listed name exactly, letter case included. Every type can be deleted, Build Secrets included. See https://cursor.com/docs/cloud-agent/api/endpoints#delete-an-environment-secret.
      operationId: deleteEnvironmentSecret
      parameters:
        - name: id
          in: query
          required: false
          description: "The `id` of the version to delete."
          schema:
            type: string
            example: 'secv_3qKx9mT2bV7nR1cW5yZ8aQ'
      responses:
        '200':
          description: "The version was deleted."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Plan or role not allowed, the environments API isn't enabled for your account (`feature_unavailable`), a `grok_` API key (`key_not_supported`), or a team that lets only admins change secrets (`team_admin_required`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "The environment doesn't exist or your API key can't change its secrets, including an environment outside its repository limit (`environment_not_found`), or the name or `?id=` isn't a version here (`secret_not_found`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: "The name has several versions and no `?id=` (`secret_name_ambiguous`, with `versions`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretNameAmbiguousError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/repositories:
